version: '3.8'

services:
  # ---------------------------------------------------------
  # 1. Spring Boot Application
  # ---------------------------------------------------------
  app:
    build: .
    container_name: course-platform-api
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_FORWARD_HEADERS_STRATEGY=framework
      - DATABASE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - DATABASE_USERNAME=${POSTGRES_USER}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - ELASTICSEARCH_URIS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=  # Empty (Security disabled for RAM savings)
      - ELASTICSEARCH_PASSWORD=
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS}
    ports:
      - "127.0.0.1:8080:8080"  # BIND TO LOCALHOST ONLY
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  # ---------------------------------------------------------
  # 3. PostgreSQL Database
  # ---------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: course-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ---------------------------------------------------------
  # 4. Elasticsearch (Tuned for 4GB RAM)
  # ---------------------------------------------------------
  elasticsearch:
    image: elasticsearch:9.3.0
    container_name: course-elastic
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"  # STRICT 1GB LIMIT
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elastic_prod_data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always

volumes:
  postgres_prod_data:
  elastic_prod_data: