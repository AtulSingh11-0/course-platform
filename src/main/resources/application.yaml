spring:
  application:
    name: course-platform-api

  config:
    import: optional:file:.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false

  jackson:
    serialization:
      indent-output: true
    time-zone: UTC
    default-property-inclusion: non_null

  web:
    resources:
      add-mappings: false

# OpenAPI / Swagger Configuration - Common paths
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /index.html
    operations-sorter: method
    tags-sorter: alpha
    filter: true
    doc-expansion: none
  show-actuator: false






